name: E2E

# Playwright against celstv.com (e2e/README.md): after each push to main once Vercel serves it,
# every day, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test"
        default: "https://celstv.com"

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://celstv.com' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the deploy of this commit
        if: github.event_name == 'push'
        # The site doesn't expose which commit it serves; Vercel builds take about 3–5 minutes.
        run: |
          sleep 360
          curl -fsS --retry 10 --retry-delay 30 --retry-all-errors "$E2E_BASE_URL/" -o /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
